<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BG Academy">
<meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<title>Backgammon Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
:root{
  --bg:#f3f4f5; --surface:#fff; --raised:#fff; --fg:#1c1e21; --muted:#686e75; --faint:#9aa0a6; --line:#e1e3e6; --fill:#e9ebed;
  --primary:#1c1e21; --on-primary:#fff;
  --gold:#c99128; --gold-soft:#f3e7cc;
  --good:#1d8a4b; --goodbg:#e5f3ea; --ok:#5a7a22; --okbg:#eef3e1; --warn:#a86300; --warnbg:#f8eedd; --bad:#c3312a; --badbg:#f9e5e3;
  --frame1:#6b4329; --frame2:#4a2c19; --felt:#245039; --felt2:#1e4430; --ptA:#eadcbc; --ptB:#922f24; --tray:#3a2414; --lbl:#e9d6b4;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131416; --surface:#1c1d20; --raised:#232428; --fg:#f1f2f4; --muted:#a0a5ac; --faint:#6f747b; --line:#2d2f33; --fill:#2a2c30;
  --primary:#f1f2f4; --on-primary:#131416;
  --gold:#e3b04f; --gold-soft:#3a3020;
  --good:#4cc27e; --goodbg:#16271d; --ok:#a6c867; --okbg:#202716; --warn:#f0a23a; --warnbg:#2e2414; --bad:#ff6d62; --badbg:#321918;
  --frame1:#553420; --frame2:#3a2213; --felt:#1f4531; --felt2:#193a29; --ptA:#d9c9a6; --ptB:#7f281f; --tray:#2c1b0f;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 17px/1.45 var(--font);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{max-width:680px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(var(--tabh) + 28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.back{display:inline-block;font-size:14px;color:var(--muted);text-decoration:none;padding:6px 0}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.lt h1{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin:0}
.lt .sub{color:var(--muted);font-size:15px;margin-top:4px}
.gear{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:0 0 auto}
.gear svg{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.01em}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--fg)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;position:absolute;transform:translate(14px,-8px)}
@media (min-width:1000px){
  nav.tabs{top:0;right:auto;width:200px;height:auto;flex-direction:column;justify-content:flex-start;padding:24px 12px;border-top:0;border-right:1px solid var(--line);background:var(--bg)}
  nav.tabs .in{flex-direction:column;gap:2px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px;border-radius:10px}
  nav.tabs button[aria-current=page]{background:var(--fill)}
  .badge{position:static;transform:none;margin-left:auto}
  .app{padding-left:240px;max-width:960px;padding-bottom:40px}
}

/* ---------- groups ---------- */
.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;margin:0 0 22px}
.gh{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:26px 4px 10px}
.gh small{display:block;font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.row .tx{flex:1;min-width:0}
.row .tt{font-weight:600}
.row .ds{color:var(--muted);font-size:15px;line-height:1.35}
.row .chev{color:var(--faint);flex:0 0 auto}
.row.dim .tt,.row.dim .ds{opacity:.55}
.row .val{color:var(--muted);font-size:15px;white-space:nowrap}
button.row:active{background:var(--fill)}
.ring{flex:0 0 auto}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:17px;background:var(--fill);color:var(--fg);white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
.btn:disabled{opacity:.35;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 0}
.muted{color:var(--muted)}
.small{font-size:15px}
p{margin:0 0 10px}

/* today */
.hero{background:var(--surface);border-radius:var(--r-lg);padding:22px 20px 20px;margin-bottom:22px}
.hero h2{font-size:24px;line-height:1.15;letter-spacing:-.015em;margin:0 0 6px}
.hero .plan{list-style:none;margin:16px 0 20px;padding:0;display:grid;gap:12px}
.hero .plan li{display:flex;gap:12px;align-items:flex-start}
.hero .plan .ic{width:28px;height:28px;border-radius:8px;background:var(--fill);display:grid;place-items:center;flex:0 0 auto;font-size:14px;font-weight:700}
.hero .plan b{font-weight:600}
.hero .plan span.d{display:block;color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:14px 14px 12px}
.stat .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;font-variation-settings:"wdth" 85}
.stat .l{font-size:13px;color:var(--muted)}
.spark{display:block;width:100%;height:56px;margin-top:6px}
.choice{display:grid;gap:10px;margin:14px 0}
.choice button{text-align:left;padding:14px 16px;border-radius:var(--r-md);background:var(--fill)}
.choice button b{display:block}
.choice button span{color:var(--muted);font-size:15px}

/* ---------- exercise ---------- */
.ex{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;
  grid-template-rows:auto minmax(0,auto) minmax(0,1fr);
  padding:max(6px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));container-type:inline-size}
.ex.noboard{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto minmax(0,1fr)!important}
.ex.noboard .panel{max-width:620px}
.exbar{display:flex;align-items:center;gap:12px;height:48px;max-width:1180px;width:100%;margin:0 auto}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:0 0 auto}
.xbtn svg{width:16px;height:16px}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--fill);transition:background .3s}
.segs i.done{background:var(--fg)}
.segs i.miss{background:var(--warn)}
.segs i.now{background:color-mix(in srgb,var(--fg) 35%,var(--fill))}
.ctag{font-size:14px;color:var(--muted);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.exmain{display:contents}
.boardcol{min-height:0;display:flex;flex-direction:column;align-items:center;max-width:1180px;width:100%;margin:0 auto}
.boardwrap{width:100%;max-width:calc((100dvh - 330px) * 1.307);min-width:min(100%,300px);position:relative}
svg#board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-radius:14px}
.bmeta{display:flex;justify-content:space-between;width:100%;max-width:calc((100dvh - 330px) * 1.307);min-width:min(100%,300px);font-size:13px;color:var(--muted);padding:6px 4px 0;font-variant-numeric:tabular-nums}
.panel{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 4px calc(18px + env(safe-area-inset-bottom));max-width:680px;width:100%;margin:0 auto}
.prompt{font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.015em;margin:4px 0 4px}
.psub{color:var(--muted);font-size:15px;margin:0 0 14px;min-height:1.4em}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:54px;padding:12px 16px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.opt .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:0 0 auto;background:var(--fill)}
.opt .k.a{background:var(--gold);color:#1c1408}
.opt .k.b{background:#f4f1ea;color:#1c1408;border:1.5px dashed #6b5a3e}
.opt .mv{font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--fg)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt.grid2{justify-content:center;text-align:center}
.opts.two{grid-template-columns:1fr 1fr}
.tools{display:flex;gap:10px;margin-top:14px}
.tools .btn{flex:1 1 0}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

/* keypad */
.kp-disp{font-size:44px;font-weight:650;letter-spacing:-.02em;text-align:center;font-variant-numeric:tabular-nums;min-height:56px;line-height:56px;border-bottom:1.5px solid var(--line);margin:0 0 12px;font-variation-settings:"wdth" 85}
.kp-disp.empty{color:var(--faint)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:52px;border-radius:12px;background:var(--surface);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kp button.go{background:var(--primary);color:var(--on-primary);font-size:17px}
.kp button.del svg{width:22px;height:22px}
/* slider */
.est{font-size:56px;font-weight:650;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin:8px 0 14px;font-variation-settings:"wdth" 85}
input[type=range]{width:100%;height:44px;accent-color:var(--fg)}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:-4px 2px 16px}

/* feedback */
.fb{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fb{animation:none}}
.verdict{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.verdict .vd{font-size:22px;font-weight:700;letter-spacing:-.015em}
.verdict .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.good .dot{background:var(--good)}.ok .dot{background:var(--ok)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}
.good .vd{color:var(--good)}.ok .vd{color:var(--ok)}.warn .vd{color:var(--warn)}.bad .vd{color:var(--bad)}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;margin:8px 0 12px;font-size:16px}
.cmp .lab{color:var(--muted);font-size:14px}
.cmp .mv{font-weight:650;font-variant-numeric:tabular-nums}
.cmp .eq{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.why{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:8px}
.why li{padding-left:18px;position:relative;line-height:1.4}
.why li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--fg);opacity:.5}
.rule{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin:0 0 12px;font-size:15px}
.rule b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.cost{font-size:15px;color:var(--muted);margin:0 0 12px}
.q2{margin:16px 0 8px;font-weight:650;font-size:18px;letter-spacing:-.01em}
.sheetacts{display:flex;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.sheetacts .btn{flex:1 1 auto}
details.more{margin:10px 0 0;background:var(--surface);border-radius:var(--r-md);padding:4px 14px}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:15px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s}
details.more[open] summary::after{transform:rotate(-135deg)}
table.t{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 10px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
table.t th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t tr.you td{font-weight:700}
table.t tr.best td:first-child{color:var(--good);font-weight:700}
.bars{display:grid;gap:8px;margin:6px 0 14px}
.bar{display:grid;grid-template-columns:7.5em 1fr 4em;align-items:center;gap:10px;font-size:15px}
.bar .tr{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px;background:var(--fg)}
.bar.best .tr i{background:var(--good)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:230px;margin:6px 0 12px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.dgrid span{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--fill);color:var(--muted)}
.dgrid span.h{background:var(--bad);color:#fff;font-weight:700}
.dgrid span.hd{background:none;font-weight:700;color:var(--muted)}
/* lesson cards */
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px}
.card h2{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0 0 14px}
.ideas{margin:0 0 16px;padding:0;list-style:none;counter-reset:i;display:grid;gap:14px}
.ideas li{position:relative;padding-left:34px;line-height:1.45}
.ideas li::before{counter-increment:i;content:counter(i);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--fill);font-size:13px;font-weight:700;display:grid;place-items:center}
.done-hero{text-align:center;padding:12px 0 6px}
.done-hero .big{font-size:64px;font-weight:650;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 80}
.delta{font-weight:650}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}

/* landscape: board left, panel right */
@media (orientation:landscape) and (min-width:760px){
  .ex{grid-template-columns:minmax(0,1fr) minmax(320px,400px);grid-template-rows:auto minmax(0,1fr);column-gap:24px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  .exbar{grid-column:1/-1;max-width:none}
  .boardcol{justify-content:center;padding-bottom:16px}
  .boardwrap,.bmeta{max-width:calc((100dvh - 90px) * 1.307)}
  .panel{padding-top:24px;max-width:none}
}
@media (orientation:landscape) and (max-height:520px){
  .ex{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);column-gap:14px}
  .exbar{grid-column:1/-1;height:40px}
  .boardwrap,.bmeta{max-width:calc((100dvh - 60px) * 1.307)}
  .bmeta{display:none}
  .prompt{font-size:18px}
  .panel{padding-top:4px}
}

/* board */
.felt{fill:var(--felt)} .ptA{fill:var(--ptA)} .ptB{fill:var(--ptB)}
.frm2{fill:var(--frame2)} .tray{fill:var(--tray)} .lbl{fill:var(--lbl);font:600 11px var(--font);opacity:.75}
.hl{fill:var(--gold);opacity:.4;pointer-events:none}
.sring{fill:none;stroke:var(--gold);stroke-width:3;pointer-events:none}
.sring.thin{stroke-width:2;opacity:.9}
.mark{fill:none;stroke:#ff6d62;stroke-width:3;pointer-events:none;stroke-dasharray:4 3}
.ghost{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:5 4;pointer-events:none}
.zone{fill:transparent;cursor:pointer}
.cnt{font:700 15px var(--font);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dielbl{font:700 12px var(--font);fill:#1a120c;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.arw{fill:none;stroke-width:4;stroke-linecap:round;pointer-events:none}
.arwlbl{font:700 13px var(--font);text-anchor:middle;dominant-baseline:central;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s}
dialog{border:0;border-radius:var(--r-lg);background:var(--bg);color:var(--fg);padding:20px;max-width:min(460px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:#0007}
dialog h2{margin:0 0 14px;font-size:24px;letter-spacing:-.015em}
.set .row{min-height:56px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:7px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px #0002}

/* ---------- terms, sheet, strategy, glossary ---------- */
.term{display:inline;padding:0;margin:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--fg) 45%,transparent);cursor:help;border-radius:3px}
.term:hover{text-decoration-color:var(--gold)}
.term:active{background:var(--gold-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{min-height:34px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600}
.chip:active{background:var(--gold-soft)}
.lookup{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.lookup .chip{min-height:30px;font-size:14px;padding:0 12px}
button.rule{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.rule .rt{display:block}
button.rule .rwhy{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:600;color:var(--muted)}
button.rule:active{background:var(--fill)}
.seg.lg{display:flex;margin:0 0 18px;padding:3px;border-radius:12px}
.seg.lg button{flex:1;min-height:36px;font-size:15px;border-radius:9px}
.seg.lg.sm{margin:4px 0 6px}
.lead-sub{color:var(--muted);margin:0 4px 14px;font-size:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;min-height:44px;color:var(--muted);margin:0 0 6px}

<script>

    if (b[25] > 0 && from !== 25) return false;
    var to = from - die;
    if (to >= 1) return b[O + 25 - to] <= 1;
    if (!allHome(b)) return false;
    if (to === 0) return true;
    for (var i = from + 1; i <= 6; i++) if (b[i]) return false;
    return true;
  }
  // Returns new board and hit flag in out[0]
  function applyStep(b, from, die, out) {
    var r = new Int8Array(b), to = from - die, hit = false;
    r[from]--;
    if (to >= 1) {

      r[to]++;

    return r;
  }
  // All legal plays (distinct resulting positions) for dice d1,d2.
  // Each entry: {pos, steps:[[from,to,hit,die],...]}

    var map = new Map(), maxDepth = 0, dbl = d1 === d2;
    var hitOut = [false];
    function rec(bb, dice, di, steps, minFrom) {
      var any = false;
      if (di < dice.length) {
        var die = dice[di];
        var top = bb[25] > 0 ? 25 : 25;
        for (var from = top; from >= 1; from--) {
          if (dbl && from > minFrom) continue;
          if (!canMove(bb, from, die)) continue;

          var nb = applyStep(bb, from, die, hitOut);

          rec(nb, dice, di + 1, steps, from);
          steps.pop();

      }

        var depth = steps.length;

        if (depth > maxDepth) { maxDepth = depth; map.clear(); }

        if (!map.has(k)) map.set(k, { pos: bb, steps: steps.slice() });

    else { rec(b, [d1, d2], 0, [], 25); rec(b, [d2, d1], 0, [], 25); }
    var list = Array.from(map.values());

    for (var i = 19; i <= 24; i++) if (b[O + i]) return 3; // opp checker in my home board

  }

    for (var j = 25; j >= 1; j--) if (b[O + j]) { oppBack = j; break; }

  var NIN = 196, NOUT = 5;
  function Net(H, weights) {

  Net.prototype.init = function (seed) {

    function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < this.w.length; i++) this.w[i] = (rnd() - 0.5) * 0.2;

    var na = 0, idx = this.idx, val = this.val;
    for (var side = 0; side < 2; side++) {
      var s = side * O, base = side * 98;
      for (var p = 1; p <= 24; p++) {
        var n = b[s + p];
        if (!n) continue;
        var bi = base + (p - 1) * 4;
        idx[na] = bi; val[na++] = 1;
        if (n >= 2) { idx[na] = bi + 1; val[na++] = 1; }
        if (n >= 3) { idx[na] = bi + 2; val[na++] = 1; }
        if (n > 3) { idx[na] = bi + 3; val[na++] = (n - 3) / 2; }

      if (b[s + 25]) { idx[na] = base + 96; val[na++] = b[s + 25] / 2; }

  function evalPre1(net, b) {

  // Returns cubeful equity normalized to a 1-cube.

    notation: notation, terminalProbs: terminalProbs

})();

<script>
// ===== Backgammon Academy analysis core (shared by the offline generator and the page) =====
// Conventions follow the BG engine: board Int8Array(52), side 0 = the player we are teaching,
// indices 1..24 = that side's points (1 = ace point), 25 = bar; opponent at O + i in its own numbering.
var TA = (function () {
  "use strict";
  var BG_ = (typeof BG !== "undefined") ? BG : require("./engine.js");
  var O = 26;

  // ---------- encoding ----------
  function enc(b) { var s = ""; for (var i = 0; i < 52; i++) s += String.fromCharCode(65 + b[i]); return s; }
  function dec(s) { var b = new Int8Array(52); for (var i = 0; i < 52; i++) b[i] = s.charCodeAt(i) - 65; return b; }

  // ---------- shots ----------
  // Rolls (out of 36) on which the opponent has a legal play that hits one of our checkers.
  // pos: our after-state (opponent on roll). Returns {n, grid[6][6] booleans}.
  function shots(pos) {
    var fb = BG_.flip(pos), bar0 = fb[O + 25], n = 0, grid = [];
    for (var i = 0; i < 6; i++) grid.push([false, false, false, false, false, false]);
    for (var a = 1; a <= 6; a++) for (var c = a; c <= 6; c++) {
      var L = BG_.genMoves(fb, a, c).list, hit = false;
      for (var k = 0; k < L.length; k++) if (L[k].pos[O + 25] > bar0) { hit = true; break; }
      if (hit) { grid[a - 1][c - 1] = grid[c - 1][a - 1] = true; n += a === c ? 1 : 2; }
    }
    return { n: n, grid: grid };
  }

  // ---------- structure ----------
  function longestPrime(b) {
    var best = 0, bs = 0, run = 0;
    for (var p = 1; p <= 24; p++) {
      if (b[p] >= 2) { run++; if (run > best) { best = run; bs = p - run + 1; } } else run = 0;
    }
    return { len: best, from: bs, to: bs + best - 1 };
  }

    { id: "blot", t: "Blot", re: "blots?", d: "A single checker alone on a point.", w: "It can be hit. If your opponent lands on it, it goes to [[bar|the bar]] and has to start its journey again.", dia: "blot", rel: ["hit", "shot", "point"] },
    { id: "point", t: "Point", re: "make a point|makes? a point|making points|made points?", d: "Each of the 24 triangles is a point. You \"make\" a point by putting two or more of your checkers on it.", w: "A made point is safe and your opponent can't land on it. Made points block their checkers, and points in your [[home]] make it harder for a hit checker to come back in.", dia: "point", rel: ["blot", "prime", "anchor"] },
    { id: "hit", t: "Hit", re: "hits?|hitting|return hits?", d: "Landing on your opponent's [[blot]]. Their checker goes to [[bar|the bar]].", w: "The hit checker loses every [[pip]] it had travelled, and its owner must bring it back in before moving anything else. That costs them ground in the race and part of their next roll.", dia: "hit", rel: ["blot", "bar", "enter"] },
    { id: "bar", t: "The bar", re: "the bar(?! point)|on the bar", d: "The raised strip down the middle of the board. Checkers that get hit wait there.", w: "A player with a checker on the bar must [[enter]] it before making any other move, so a checker on the bar freezes the rest of their position.", rel: ["hit", "enter", "dance"] },
    { id: "enter", t: "Enter", re: "re-?enter(?:s|ing|ed)?|enter(?:s|ing|ed)?", d: "Bringing a checker back from the bar. It comes in on your opponent's home board: a 3 enters on their 3-point, a 5 on their 5-point, and so on.", w: "You can't enter on a point they've made. The more home-board points they have, the more of your rolls fail.", rel: ["bar", "dance", "home"] },
    { id: "dance", t: "Dance", re: "danc(?:e|es|ing)", d: "Failing to enter from the bar because both numbers you rolled land on made points.", w: "You lose your whole turn while your opponent keeps building. Against 2 made home points you dance on 4 of 36 rolls; against 5 points, on 25.", rel: ["enter", "closeout", "blitz"] },
    { id: "shot", t: "Shot", re: "shots?", d: "A roll that lets your opponent hit one of your blots. \"Leaves 11 shots\" means 11 of their 36 possible rolls hit you.", w: "Counting shots turns a vague worry into a number, so you can compare the risk of two plays exactly.", dia: "blot", rel: ["direct", "indirect", "rolls36"] },
    { id: "direct", t: "Direct shot", re: "direct shots?|direct", d: "A blot within 6 pips of an enemy checker. A single die can hit it.", w: "Direct shots are hit by 11 to 17 of the 36 rolls, roughly a third to a half of the time.", rel: ["shot", "indirect"] },
    { id: "indirect", t: "Indirect shot", re: "indirect shots?|indirect", d: "A blot 7 to 12 pips from an enemy checker. It takes both dice together to hit it.", w: "Indirect shots are hit by only 2 to 6 rolls, so if you must leave a blot, leaving it 7 or more pips away is usually much safer.", dia: "indirect", rel: ["shot", "direct"] },
    { id: "rolls36", t: "Rolls out of 36", re: "of their 36 possible rolls|out of 36|of 36|36 rolls", d: "Two dice can land 36 ways. 5-3 and 3-5 count separately, so each non-double is 2 of the 36. Each double, like 4-4, is 1.", w: "Every probability in backgammon is counted out of 36. 18 rolls is 50%, 12 is a third, 9 is a quarter.", rel: ["shot"] },
    { id: "home", t: "Home board", re: "home boards?|home-board|home points?", d: "Your points 1 to 6, where you bear off. On this board it's the bottom-right quarter. Your opponent's home board is top right.", w: "All 15 of your checkers must be in your home board before you can bear off. Points you make there also block opponent checkers trying to enter from the bar.", dia: "home", rel: ["outer", "bearoff", "enter"] },
    { id: "outer", t: "Outer board", re: "outer boards?|outfield", d: "Points 7 to 12 on each side, between the home boards and the midpoints.", w: "Checkers in your outer board are builders for your home and bar points, and points made there start a blockade.", rel: ["home", "builder"] },
    { id: "midpoint", t: "Midpoint", re: "midpoint", d: "Your 13-point, where five of your checkers start.", w: "It's a safe stopping place for checkers coming around the board, and the source of builders in the opening.", rel: ["builder"] },
    { id: "barpoint", t: "Bar point", re: "bar point", d: "Your 7-point, right next to the bar, just outside your home board.", w: "With your 6-point, it blocks their back checkers from escaping with 6s. It's the second most valuable point to make early.", rel: ["prime", "golden"] },
    { id: "golden", t: "5-point", re: "5-point|golden point", d: "Your 5-point, often called the golden point.", w: "It blocks their back checkers, counts as a home-board point when you hit, and is also the best point for them to hold. Making it does three jobs at once.", rel: ["point", "anchor", "barpoint"] },
    { id: "back", t: "Back checkers", re: "back checkers?", d: "Your two checkers that start furthest away, on your opponent's 1-point (your 24-point).", w: "They have the longest journey home, so if your opponent builds a wall in front of them they get trapped.", rel: ["split", "anchor", "escape"] },
    { id: "escape", t: "Escape", re: "escap(?:e|es|ing|ed)", d: "Getting a back checker past your opponent's blocking points and out into the open.", w: "A checker that escapes is out of danger of being trapped and can head home.", rel: ["back", "prime"] },
    { id: "builder", t: "Builder", re: "builders?", d: "A spare checker within six pips of a point you want to make.", w: "To make a point you need two checkers to land on it in one roll. The more builders aimed at it, from different distances, the more rolls make it.", dia: "builder", rel: ["slot", "diversify"] },
    { id: "slot", t: "Slot", re: "slots?|slotting|slotted", d: "Placing a single checker on a point you want, planning to cover it next turn.", w: "It's quicker than waiting for a roll that makes the point in one go, but until it's covered the slotted checker is a blot that can be hit.", dia: "slot", rel: ["builder", "blot"] },
    { id: "split", t: "Split", re: "split(?:s|ting)?", d: "Moving your two back checkers apart, usually one or two points.", w: "Split checkers can make an anchor or escape with more numbers, and they discourage your opponent from leaving blots nearby. The cost is that each one can be attacked.", rel: ["back", "anchor"] },
    { id: "prime", t: "Prime", re: "primes?|priming|primed", d: "Several made points in a row. Six in a row is a full prime.", w: "A checker moves at most 6 pips per die, so nothing behind a full six-point prime can get past it. Even four or five in a row blocks most rolls.", dia: "prime", rel: ["point", "escape", "timing"] },
    { id: "anchor", t: "Anchor", re: "anchors?", d: "Two or more of your checkers on a point in your opponent's home board.", w: "An anchor can't be hit, gives your hit checkers a safe place to land, and keeps the chance of a shot later. The best anchors are on their 5-point and 4-point.", dia: "anchor", rel: ["back", "holding", "backgame"] },
    { id: "pip", t: "Pip", re: "pips?", d: "One step along the board. A checker on your 8-point needs 8 pips to bear off.", w: "Pips measure distance. Adding them up gives the pip count, the basic measure of the race.", rel: ["pipcount", "race"] },
    { id: "pipcount", t: "Pip count", re: "pip counts?|pip lead", d: "The total number of pips you need to bear all your checkers off. Both players start at 167.", w: "The lower count is ahead in the race. Before any cube decision, and whenever you're choosing between racing and holding, you need it.", rel: ["pip", "race", "keith"] },
    { id: "race", t: "Race", re: "pure races?|races?|racing", d: "The contest of who bears off first. A pure race is a position where the checkers have passed each other and no more hitting is possible.", w: "In a pure race only speed matters, so the pip count decides almost everything.", rel: ["pipcount", "contact"] },
    { id: "contact", t: "Contact", re: "contact", d: "Positions where some checkers still have to pass the other side's checkers, so hits are still possible.", w: "While there's contact, safety and structure matter. Once contact is broken, it's a race.", rel: ["race"] },
    { id: "bearoff", t: "Bear off", re: "bear(?:s|ing)? off|borne off|bearing off", d: "Removing your checkers from the board. You can start once all 15 are in your home board.", w: "The first player to bear off all 15 wins.", rel: ["bearin", "home", "gammon"] },
    { id: "bearin", t: "Bear in", re: "bear(?:ing)? in(?! mind)", d: "Bringing your last checkers into your home board, ready to bear off.", w: "If your opponent still holds a point in your board, bearing in carelessly leaves blots they can hit.", rel: ["bearoff", "anchor"] },
    { id: "gammon", t: "Gammon", re: "gammons?|gammoned|gammonish", d: "Winning before your opponent has borne off a single checker. A gammon counts as 2 points. If they also still have a checker on the bar or in your home board, it's a backgammon, worth 3.", w: "Gammons can matter as much as winning or losing. A play that wins a few more gammons can be better than one that wins slightly more often.", rel: ["bearoff", "too-good"] },
    { id: "blitz", t: "Blitz", re: "blitz(?:es|ing)?", d: "An all-out attack on checkers in your home board: hitting again and again while making home points.", w: "If it works, their checkers can't enter and you often win a gammon. It needs builders close to home.", rel: ["closeout", "dance"] },
    { id: "closeout", t: "Closeout", re: "close(?:s|d)? (?:them |it )?out|closeouts?|closed board", d: "All six of your home-board points made. A checker on the bar can't enter at all.", w: "Your opponent can't move until you open a point, and a closeout wins a gammon a large share of the time.", rel: ["blitz", "dance"] },
    { id: "pointon", t: "Pointing on a blot", re: "point(?:s|ing)? on", d: "Hitting a blot with two checkers at once, so you make a point on top of it.", w: "You get everything a hit gives you, and your own checkers are safe.", rel: ["hit", "point"] },
    { id: "stack", t: "Stack", re: "stack(?:s|ed|ing)?|piling", d: "Piling four or more checkers on one point.", w: "Extra checkers on a point block nothing new. Spread out, they'd be builders or cover blots.", rel: ["builder"] },
    { id: "holding", t: "Holding game", re: "holding games?|holding", d: "Keeping an anchor in your opponent's board while you're behind in the race, waiting for a shot as they come home.", w: "It turns a losing race into a game where one hit can swing everything.", rel: ["anchor", "timing"] },

    { id: "timing", t: "Timing", re: "timing", d: "How many pips you can still play before you're forced to break up your good points.", w: "If you run out of spare moves while waiting for a shot, your own board crumbles and the shot comes too late.", rel: ["backgame", "holding", "prime"] },
    { id: "dup", t: "Duplication", re: "duplication|duplicat(?:e|es|ing)", d: "Leaving blots where your opponent needs the same numbers to hit you that they need for something else.", w: "Each roll can only do one job, so overlapping their good numbers cuts your real risk.", rel: ["diversify", "shot"] },
    { id: "diversify", t: "Diversification", re: "diversification|diversif(?:y|ies)", d: "Arranging your builders so that many different numbers help you.", w: "It's the flip side of duplication: you want your good numbers spread out and theirs bunched together.", rel: ["dup", "builder"] },

        "That's why 3-1 is the best opening roll, and why slotting or building toward the 5-point is so common early on."],
      not: "Once their back checkers have escaped, it's just another home-board point." },
    { id: "build-split", lv: 1, ty: "open", c: "opening", t: "With other rolls, bring builders down or split", s: "Prepare a point for next turn, or give your back checkers room.",
      why: ["Rolls like 2-1, 4-3 or 6-2 can't make a point, so they prepare one. A checker brought down from your midpoint becomes a builder that can help make your 5-point or bar point next turn.",
        "Splitting your back checkers makes it easier for them to make an anchor or escape later, and discourages your opponent from leaving blots nearby."],
      not: "The good choices for these rolls are almost equal. Pick a family of plays and play it with confidence; the difference is tiny." },
    { id: "hit-early", lv: 1, ty: "open", c: "reply", t: "Hit early, while their home board is weak", s: "Getting hit back costs you little in the opening.",
      why: ["A hit costs your opponent every pip that checker had travelled, and they must spend part of their next roll bringing it back in.",
        "Early on their home board has few points, so if they hit you back you'll almost always come straight back in. The risk is small and the gain is real."],
      not: "Once your opponent has three or more home-board points, a return hit can cost you whole turns. Then weigh the risk." },
    { id: "hit", lv: 1, ty: "mid", c: "hit", t: "When in doubt, hit", s: "Hitting gains ground and takes away half their next roll.",
      why: ["Hitting swings the race: the hit checker loses all the pips it had travelled. It also forces your opponent to use part of their next roll entering, so they have fewer good moves.",
        "Two hits in one turn are often crushing, because they have two checkers to bring in and may [[dance]] completely."],
      not: "Don't hit if it leaves you open to many return shots from a strong board, or if it breaks a point you badly need.", dia: "hit" },
    { id: "count-shots", lv: 1, ty: "mid", c: "shots", t: "Count shots before you leave a blot", s: "Know how many of their 36 rolls hit you.",
      why: ["Every blot has a price: the number of rolls out of 36 that hit it. A blot 6 pips from an enemy checker is hit by 17 rolls (47%). One 10 pips away is hit by only 3.",
        "Comparing shot counts is how strong players choose between two plays that look alike."],
      not: "Fewest shots isn't always best. A play that leaves more shots can still be right if it builds something valuable.", dia: "blot" },
    { id: "indirect", lv: 1, ty: "mid", c: "safety", t: "Leave indirect shots, not direct ones", s: "Seven or more pips away cuts the risk by more than half.",
      why: ["A checker within 6 pips of an attacker can be hit with a single die, so 11 to 17 rolls hit it. Beyond 6 pips the attacker needs both dice together, and only 2 to 6 rolls work.",
        "So when you must leave a blot, putting it 7 or more pips away from their checkers is usually the cheapest risk."],
      not: "Your own points in between block some combinations and lower the count further. Count the actual position.", dia: "indirect" },
    { id: "dont-stack", lv: 1, ty: "mid", c: "points", t: "Don't stack checkers", s: "A fourth or fifth checker on one point does almost nothing.",
      why: ["Two checkers make a point. More on the same point block nothing new. Moved elsewhere, they could be builders for new points or cover blots.",
        "Spreading your checkers gives you more good rolls next turn, which is what a flexible position means."],
      not: "A third checker on a point is often useful as a spare: you can move it without giving the point up." },
    { id: "run-back", lv: 1, ty: "mid", c: "escape", t: "Don't leave your back checkers too long", s: "Get them moving before a wall goes up in front of them.",
      why: ["Your back checkers start furthest from home. If your opponent builds several points in a row in front of them, they get trapped behind a prime.",
        "Moving them up, splitting them, or running with 6s early keeps them from getting stuck."],
      not: "If you hold a good anchor and trail in the race, staying back to wait for a shot can be right. That's a holding game." },
    { id: "know-race", lv: 1, ty: "race", c: "pips", t: "Know the race before you pick a plan", s: "Ahead in the race: get past them. Behind: keep contact.",
      why: ["The pip count tells you who's ahead in the race. If you're ahead, you want to get past your opponent's checkers and turn the game into a pure race.",
        "If you're behind, you want to keep contact so you can still hit a shot. Many mistakes come from playing the wrong plan: running when behind, or hanging back when ahead."],
      not: "In a big attack or a blitz, the race barely matters. Structure and threats decide the game." },
    { id: "pip-shortcuts", lv: 1, ty: "race", c: "pips", t: "Count pips in groups and by difference", s: "Faster counting leaves more attention for the decision.",
      why: ["Count point by point, multiplying: three checkers on the 8-point is 24. Group numbers that add to 10 or 20.",
        "When you only need to know who's ahead, cancel checkers that mirror each other on the two sides and count what's left. It's quicker and less error-prone."],
      not: "" },
    { id: "bear-off", lv: 1, ty: "race", c: "bearoff", t: "Bear a checker off whenever you can", s: "In a pure race, checkers off are progress you can't lose.",
      why: ["With no contact left, only finishing first matters. A checker off can never be wasted, while shuffling checkers inside your board often costs a whole roll later.",
        "When you can't take one off, fill empty high points so future big numbers aren't wasted."],
      not: "If your opponent still has a checker behind yours, safety comes first. Don't leave a blot just to bear off." },
    { id: "take-25", lv: 1, ty: "cube", c: "take", t: "Take a double if you win 1 game in 4", s: "Passing costs 1 point. Taking risks 2, but wins 2 when you come back.",
      why: ["If you pass, you lose 1 point for sure. If you [[take]], the stake doubles: you lose 2 points when you lose, and win 2 when you win.",
        "At exactly 25% wins, taking works out the same as passing on average: 0.25 × 2 − 0.75 × 2 = −1. Win more often than that and taking is better."],
      not: "Gammons change the math: losing a gammon after taking costs 4 points. Owning the cube helps a little the other way, because you can redouble later." },
    { id: "dont-double-early", lv: 1, ty: "cube", c: "cube1", t: "Don't double just because you're ahead", s: "Double when your lead could soon be too big for them to take.",
      why: ["When you double, the cube goes to your opponent and only they can double next. Doubling too early gives that away for nothing.",
        "The right moment is when your position is strong and could become much stronger next turn. If you wait and it does, they'll [[pass]], and you'll have lost your market."],
      not: "If they should already pass, don't wait. Double and collect the point." },

    // ---------- Intermediate ----------
    { id: "point-on", lv: 2, ty: "open", c: "reply", t: "Point on their blot when you can", s: "Hitting with two checkers both gains and stays safe.",
      why: ["Pointing on a blot means hitting it with two checkers at once. You gain everything a hit gains, and your checkers end up safe on a made point.",
        "Early in the game, pointing on a blot in your home board, especially on your 5-point or 4-point, is one of the strongest plays available."],
      not: "If pointing would strip your position of spares or break your midpoint, compare it with simply hitting loose." },
    { id: "anchor", lv: 2, ty: "open", c: "anchor", t: "Make an advanced anchor when you're under attack", s: "Their 5-point or 4-point gives your back checkers a safe base.",
      why: ["An anchor can't be hit, so it stops a blitz and gives your hit checkers somewhere to land.",
        "Advanced anchors, on their 5-point or 4-point, are best: from there it's easy to escape, and they're hard to trap behind a prime."],
      not: "A deep anchor on their 1-point or 2-point is much weaker. It's easily primed and doesn't help you escape.", dia: "anchor" },
    { id: "prime", lv: 2, ty: "mid", c: "prime", t: "Build a prime in front of their back checkers", s: "Six points in a row can't be jumped.",
      why: ["A checker moves at most 6 pips per die, so six points in a row form a wall nothing can pass. Even four or five in a row block most escaping rolls.",
        "Once a checker is trapped, you can roll the prime forward point by point until it's closed in your home board."],
      not: "A prime far away from the trapped checker blocks little. Build it directly in front of them.", dia: "prime" },
    { id: "contain", lv: 2, ty: "mid", c: "prime", t: "After a late hit, contain the checker", s: "A hit you can't follow up just helps them in the race.",
      why: ["Hitting late in the game only wins if you keep that checker from getting away. Build points in front of it rather than racing home.",
        "Containment needs builders and points in your outer board, not just your home board."],
      not: "If you're far ahead in the race already, sometimes the safe race is better than chasing." },
    { id: "blitz", lv: 2, ty: "mid", c: "blitz", t: "Attack when they're on the bar", s: "Each point you add makes entering harder.",
      why: ["A checker on the bar must enter before anything else moves. Against 2 made home points they fail on 4 of 36 rolls; against 4 points, 16; against 5, 25.",
        "While they're stuck they can't build or attack. Keep hitting and making home points, and it often ends in a closeout and a gammon."],
      not: "If you run out of builders, a failed blitz leaves blots everywhere. Know when to switch to quietly making points." },
    { id: "duplicate", lv: 2, ty: "mid", c: "dup", t: "Duplicate their numbers", s: "Leave blots where they need the same roll for two jobs.",
      why: ["If they need 6s to hit you and also need 6s for something else they want, like escaping, every 6 can only do one job. Your real risk is smaller than the shot count suggests.",
        "Two plays that leave the same number of blots can differ by four or more effective shots this way."],
      not: "It only helps if the other job is important to them. If they'd rather hit anyway, there's no saving." },
    { id: "diversify", lv: 2, ty: "mid", c: "points", t: "Spread your builders over different distances", s: "You want many different numbers to help you.",
      why: ["Builders 1, 2 and 3 pips from a target point can make it with many rolls. Builders all the same distance away use only one number.",
        "That's diversification, the flip side of duplication: your good numbers spread out, theirs bunched up."],
      not: "", dia: "builder" },
    { id: "bold", lv: 2, ty: "mid", c: "safety", t: "Be bolder when their home board is weak", s: "A hit costs little when you can come straight back in.",
      why: ["If their home board has one or two points, a checker sent to the bar almost always comes back in immediately. You lose only the pips it had travelled.",
        "Against a strong board, the same hit can cost you several turns or a gammon. The same blot has a very different price."],
      not: "Bold plays still need a payoff. Leaving shots for no gain is never right." },
    { id: "timing", lv: 2, ty: "mid", c: "anchor", t: "Keep spare moves in reserve", s: "That's timing: room to move without breaking your position.",
      why: ["Timing is how many pips you can play before you're forced to break up your good points. Run out, and you'll have to give up an anchor or wreck your home board.",
        "When you're holding and waiting for a shot, keep checkers back and moves in reserve."],
      not: "In a pure race, timing doesn't matter. Only the pip count does." },
    { id: "estimate", lv: 2, ty: "mid", c: "estimate", t: "Judge a position: race, then structure, then threats", s: "A quick way to estimate your chances.",
      why: ["Start with the pip count. Then look at structure: home-board points, primes and anchors on each side. Then threats: blots, checkers on the bar, shots coming up.",
        "Putting a rough number on your chances builds the instinct that every cube decision depends on."],
      not: "" },
    { id: "bear-in", lv: 2, ty: "race", c: "bearin", t: "Bear in safely: clear points from the back", s: "Bring checkers in so no gap forces a blot.",
      why: ["When your opponent still holds a point in your board, any blot you leave can be hit. Clearing your highest point first keeps your remaining checkers together.",
        "Even numbers of checkers on your outer points let you clear them in pairs. Gaps in your home board create awkward rolls that force you to leave shots."],
      not: "Once their last checker has passed yours, it's a pure race and speed matters more than shape." },
    { id: "keith", lv: 2, ty: "race", c: "racecube", t: "Use the Keith count for race doubles", s: "Double when D is 4 or less; take when D is 2 or more.",
      why: ["Add to each side's pip count: 2 for each checker beyond the first on the 1-point, 1 for each beyond the first on the 2-point, 1 for each beyond the third on the 3-point, and 1 for each empty 4, 5 or 6-point. Then add one-seventh to the count of the player on roll.",
        "Plain pip counts miss wasted pips: stacks low in your board and gaps make you slower than the count says. The adjustments fix that, which is why the formula is accurate to within a few percent."],
      not: "It's for pure races only. With contact, use judgment." },
    { id: "8-9-12", lv: 2, ty: "race", c: "racecube", t: "Quick check: the 8-9-12 rule", s: "An 8% lead doubles; beyond 12%, they should pass.",
      why: ["Divide your pip lead by your own pip count. In a long race, an 8% lead is a first double, 9% a redouble, and up to 12% your opponent can still take.",
        "Being on roll is worth about half a roll, around 4 pips, which is why a modest lead is already enough to double."],
      not: "In short races, under about 30 pips, count rolls instead." },
    { id: "market", lv: 2, ty: "cube", c: "cube1", t: "Double before you lose your market", s: "Ask: could next turn turn this into a pass?",
      why: ["Your market is the range where they'd still take. If a good sequence next turn would push them into a pass, doubling now gets 2 points at stake while you're a big favourite.",
        "Positions that can swing fast, like a blitz or a big shot, lose their market quickly, so they're doubled earlier than slow positions."],
      not: "Fast-swinging positions can also swing against you. If you're barely ahead, wait." },
    { id: "gammon-take", lv: 2, ty: "cube", c: "take", t: "Gammons make takes harder", s: "If you'll lose doubled gammons, you need more wins.",
      why: ["Each gammon you lose after taking costs 4 points instead of 2. Even 10% gammons can push the break-even point well above 25%.",
        "Look for warning signs: several of your checkers trapped, or a closeout coming."],
      not: "Your own gammon chances work the other way and make takes easier." },
    { id: "own-cube", lv: 2, ty: "cube", c: "take", t: "Owning the cube makes takes a little easier", s: "After you take, only you can double next.",
      why: ["When you take, the cube is yours. If the game turns your way you can redouble and force them to pass, so some games you'd have lost become wins.",
        "That's why many takes are correct with about 21 to 23% winning chances rather than a full 25%."],
      not: "In very short races there's little time to use the cube, so the take point moves back toward 25%." },

    // ---------- Advanced ----------
    { id: "gammons", lv: 3, ty: "mid", c: "gammon", t: "Count gammons, not just wins", s: "A gammon is worth two points.",
      why: ["Judge checker plays by points won per game, not winning chances alone. A play that wins a little less often but wins many more gammons can be clearly better.",
        "Attacking with a strong board, prefer the aggressive play. Facing a possible gammon, prefer the play that saves it, even at some cost in wins."],
      not: "" },
    { id: "backgame", lv: 3, ty: "mid", c: "backgame", t: "Back games need timing and the right points", s: "Hold two deep points and wait for a shot.",
      why: ["A back game holds two points in your opponent's home board, so their last checkers have trouble coming home safely.",
        "It only works if you can wait: you need enough timing to keep your own board intact until the shot comes, and then the strength to contain the hit checker."],
      not: "Back games lose a lot of gammons when they fail. Choose one only when nothing better is available." },
    { id: "too-good", lv: 3, ty: "cube", c: "cube2", t: "Too good to double: play for the gammon", s: "Cashing 1 point can be worse than playing on for 2.",
      why: ["If your opponent would pass, doubling wins exactly 1 point. Playing on with the cube in the middle may win 2 points by gammon.",
        "When your gammon chances are high and your losing chances very small, playing on is worth more than cashing."],
      not: "If your losing chances are real, cash. Being too good needs very few losses." },
    { id: "blitz-cube", lv: 3, ty: "cube", c: "cube2", t: "In blitzes, double early", s: "The market can vanish in a single roll.",
      why: ["A blitz can go from a solid double to a pass, or even too good, in one exchange of rolls. Wait, and you often lose your market completely.",
        "That's why strong attacks with a checker on the bar are doubled earlier than quiet positions with the same winning chances."],
      not: "If the attack is already overwhelming with many gammons, check whether you're too good to double." },
    { id: "money", lv: 3, ty: "cube", c: "cube1", t: "These tips are for money play", s: "Match scores change what gammons and doubles are worth.",
      why: ["In a match to a set number of points, the score changes how much a gammon or a doubled game is worth. A clear take in money play can be a pass at some scores, and the reverse.",
        "Everything in this app assumes money play: each game scored on its own."],
      not: "" }
  ];
  var TBY = {}, PBY = {};
  TERMS.forEach(function (x) { TBY[x.id] = x; });
  TIPS.forEach(function (x) { PBY[x.id] = x; });
  // Which tip explains each concept's rule of thumb
  var RULE_TIP = { opening: "point-rolls", pips: "know-race", points: "golden", hit: "hit", safety: "indirect", escape: "run-back", shots: "count-shots", reply: "hit-early", bearoff: "bear-off",
    anchor: "anchor", prime: "prime", blitz: "blitz", estimate: "estimate", cube1: "dont-double-early", take: "take-25", racecube: "keith", bearin: "bear-in", dup: "duplicate", gammon: "gammons", cube2: "too-good", backgame: "backgame" };
  return { TERMS: TERMS, TBY: TBY, DIA: DIA, TIPS: TIPS, PBY: PBY, TYPES: TYPES, LEVELS: LEVELS, RULE_TIP: RULE_TIP };
})();

<script>
"use strict";
let __u = new Set();
/* ================= basics ================= */
function b64ToF32(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Float32Array(u.buffer); }
const NET = new BG.Net(80, b64ToF32(NET_W));
const O = BG.O;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x * 100) + "%";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const diceTxt = d => Math.max(d[0], d[1]) + "-" + Math.min(d[0], d[1]);
function dstr(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
const today = () => dstr(new Date());
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return dstr(new Date(y, m - 1, d + n)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const NEXTICON = `<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>`;

/* ================= bank ================= */
const CONC = CUR.concepts, CBY = {}; CONC.forEach(c => CBY[c.id] = c);
const ITEMS = {}; // id -> item
Object.keys(BANK).forEach(t => BANK[t].forEach(it => { it.t = t; if (typeof it.tags === "string") it.tags = it.tags.split(","); ITEMS[it.id] = it; }));
// opening items
BANK.o = Object.keys(CUR.OPEN).map(k => {
  const d = [+k[0], +k[1]], single = CUR.OPEN[k].length === 1;
  const it = { t: "o", id: "o" + k, d, D: single ? 930 : (k === "65" ? 980 : 1120) };
  ITEMS[it.id] = it; return it;
});
const START = BG.startPos();
function poolFor(cid) {
  const c = CBY[cid];
  switch (c.kind) {
    case "move": return BANK.m.filter(x => x.tags.includes(c.tag));
    case "open": return BANK.o;
    case "pips": return BANK.p;
    case "shots": return BANK.s;
    case "bear": return BANK.b;
    case "race": return BANK.r;
    case "est": return BANK.w;
    case "take": return BANK.c.filter(x => x.cat === "DT" || x.cat === "DP");
    case "cube": return c.cubeSet === "adv" ? BANK.c.filter(x => x.cat === "TG" || x.p[1] >= 0.2) : BANK.c.filter(x => x.cat !== "TG" && x.p[1] < 0.2);
  }
  return [];
}
// which concept an item belongs to (for review and stats)
function conceptOf(it) {
  if (it.c) return it.c;
  switch (it.t) {
    case "o": return "opening"; case "p": return "pips"; case "s": return "shots"; case "b": return "bearoff";
    case "r": return "racecube"; case "w": return "estimate"; case "c": return "cube1";
    case "m": { const t = it.tags.find(x => CBY[x]); return t || "points"; }
  }
  return "points";
}

/* ================= storage & learner model ================= */
const LS = "backgammon-academy.v1";
function blank() {
  return { v: 1, placed: false, G: 1350, R: {}, n: {}, items: {}, hist: [], days: {}, rlog: [], intro: {}, seen: {}, ui: { learn: "lessons", stratLv: 0 }, cal: [], fl: { pips: [], shots: [] },
    cfg: { len: 10, level: "auto", target: "bal", hints: true }, sess: null };
}
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) { S = blank(); }
S.cfg = Object.assign(blank().cfg, S.cfg || {});
S.ui = Object.assign(blank().ui, S.ui || {}); S.seen = S.seen || {};
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }

const TARGET = { comf: 0.85, bal: 0.75, str: 0.62 };
const expect = (R, D) => 1 / (1 + Math.pow(10, (D - R) / 400));
const cR = c => S.R[c] != null ? S.R[c] : S.G;
const itemD = it => (S.items[it.id] && S.items[it.id].D) || it.D || 1200;
function overall() {
  let w = 3, s = 3 * S.G;
  for (const c in S.n) { const n = Math.min(S.n[c], 30); w += n; s += n * cR(c); }
  return Math.round(s / w);
}
function mastery(c) {
  const n = S.n[c] || 0; if (!n) return 0;
  const t = CBY[c].tier, TD = 1000 + 120 * t + 130;
  return clamp((cR(c) - (TD - 100)) / 500, 0, 1) * Math.min(1, n / 6);

/* ---------- cube decisions (contact and race) ---------- */
function cubeItem(e, worked) {
  const it = e.item, c = CBY[e.concept], b = TA.dec(it.b), race = it.t === "r";
  setBoard(b, { cube: { v: 64, at: "mid" }, meta: race && mastery(c.id) >= 0.3 ? false : undefined });
  const adv = c.cubeSet === "adv";
  const opts = [["ND", "No double"], ["DT", "Double, they take"], ["DP", "Double, they pass"]].concat(adv ? [["TG", "Too good: play on"]] : []);
  const p = it.p, truth = it.cat;
  const eqs = race ? raceEq(p) : { ND: it.nd, DT: it.dt, DP: 1 };
  const label = { ND: "No double", DT: "Double, take", DP: "Double, pass", TG: "Too good to double" };
  const prompt = race ? "Pure race, you're on roll. Your cube action?" : "Before you roll. What's the right cube action?";
  if (worked) return showRes(truth, true);
  setPanel(`<h2 class="prompt">${prompt}</h2><p class="psub">${race ? (mastery(c.id) < 0.3 ? "Pip counts are shown below the board. Try the Keith count." : "Count the race yourself, then decide.") : "Money game, cube in the middle."}</p>
    <div class="opts">${opts.map(o => `<button class="opt" data-k="${o[0]}">${o[1]}</button>`).join("")}</div>`);

    const bestEq = Math.max(eqs.ND, Math.min(eqs.DT, eqs.DP));
    let s, g;
    if (k === truth) { s = 1; g = { t: "Correct", c: "good" }; }
    else if ((dbl(k) && dbl(truth)) || (k === "ND" && truth === "TG") || (k === "TG" && truth === "ND")) { s = 0.5; g = { t: "Half right", c: "ok" }; }
    else { const gg = TA.grade(Math.max(0, bestEq - actEq(k))); s = Math.min(gg.s, 0.3); g = { t: gg.k === "inacc" ? "Inaccuracy" : gg.k === "best" || gg.k === "close" ? "Not quite" : gg.t, c: gg.c === "good" ? "ok" : gg.c }; }
    if (isWorked) g = { t: label[truth], c: "good" };
    const d = isWorked ? null : finishItem(e, s, { y: label[k], b: label[truth] });
    const rows = [["No double", eqs.ND, truth === "ND" || truth === "TG"], ["Double, take", eqs.DT, false], ["Double, pass", eqs.DP, false]];
    const dblBest = dbl(truth); if (dblBest) rows[truth === "DT" ? 1 : 2][2] = true;
    const mx = Math.max(1.2, ...rows.map(r => Math.abs(r[1])));
    const bars = `<div class="bars">${rows.map(r => `<div class="bar ${r[2] ? "best" : ""}"><span>${r[0]}</span><span class="tr"><i style="width:${clamp(50 + 50 * r[1] / mx, 2, 100)}%"></i></span><span class="v">${(r[1] >= 0 ? "+" : "−") + Math.abs(r[1]).toFixed(3)}</span></div>`).join("")}</div>`;

function splitTop(re) { const out = []; let d = 0, cur = ""; for (const ch of re) { if (ch === "(") d++; if (ch === ")") d--; if (ch === "|" && !d) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out; }

function viewLearn() {

  let h = header("Learn", "", false) + `<div class="seg lg" role="tablist">${[["lessons", "Lessons"], ["strategy", "Strategy"], ["glossary", "Glossary"]].map(([k, l]) => `<button role="tab" data-go="seg:${k}" aria-pressed="${seg === k}">${l}</button>`).join("")}</div>`;
  if (seg === "strategy") return h + viewStrategy();
  if (seg === "glossary") return h + viewGlossary();
  h += `<p class="lead-sub">Short lessons, then practice that adapts to you.</p>`;
  [[1, "Foundations"], [2, "Intermediate"], [3, "Advanced"]].forEach(([t, name]) => {
    h += `<p class="gh">${name}${t > maxTier() ? `<small>Unlocks as your rating grows. You can open any lesson now.</small>` : ""}</p><div class="group">`;
    CONC.filter(c => c.tier === t).forEach(c => {
      const n = S.n[c.id] || 0;
      h += `<button class="row ${t > maxTier() ? "dim" : ""}" data-go="concept:${c.id}">${ring(mastery(c.id), 36, !n)}<span class="tx"><span class="tt">${esc(c.title)}</span><br><span class="ds">${esc(c.blurb)}</span></span><span class="val">${stateTxt(c)}</span><span class="chev">${NEXTICON}</span></button>`;
    });
    h += `</div>`;
  });
  return h;
}
function conceptDetail(id) {
  const c = CBY[id], n = S.n[id] || 0, m = mastery(id);
  const hist = S.hist.filter(x => x.c === id).slice(-20), acc = hist.length ? Math.round(100 * hist.reduce((a, x) => a + x.s, 0) / hist.length) : null;
  return `<button class="back" data-go="back">‹ Learn</button>` + header(esc(c.title), esc(c.blurb), false) +
    `<div class="card"><ol class="ideas">${(__u = new Set(), c.ideas.map(t => `<li>${lk(t, __u)}</li>`).join(""))}</ol>${ruleHtml(c)}
    <div class="btns"><button class="btn" data-go="lesson:${id}">${S.intro[id] ? "Repeat lesson" : "Start lesson"}</button><button class="btn primary" data-go="drill:${id}">Practise 10</button></div></div>
    <div class="stats" style="margin-top:22px"><div class="stat"><div class="v">${Math.round(m * 100)}%</div><div class="l">mastery</div></div>
    <div class="stat"><div class="v">${n}</div><div class="l">positions</div></div><div class="stat"><div class="v">${acc != null ? acc + "%" : "–"}</div><div class="l">recent accuracy</div></div></div>
    ${(() => { const ts = GL.TIPS.filter(t => t.c === id); return ts.length ? `<p class="gh">Strategy tips</p><div class="group">${ts.map(tipRow).join("")}</div>` : ""; })()}`;
}
function viewDrills() {
  const avg = a => a.length ? Math.round(a.slice(-10).reduce((x, y) => x + y, 0) / Math.min(10, a.length)) + " s avg" : "";
  const row = (id, val) => { const c = CBY[id]; return `<button class="row" data-go="drill:${id}"><span class="tx"><span class="tt">${esc(c.title)}</span><br><span class="ds">${esc(c.blurb)}</span></span><span class="val">${val || ""}</span><span class="chev">${NEXTICON}</span></button>`; };
  const accOf = id => { const h = S.hist.filter(x => x.c === id).slice(-20); return h.length ? Math.round(100 * h.reduce((a, x) => a + x.s, 0) / h.length) + "%" : ""; };
  let h = header("Drills", "Ten positions at a time, aimed at one skill.", false);
  h += `<p class="gh">Counting<small>Speed and accuracy free your attention for judgment.</small></p><div class="group">${row("pips", avg(S.fl.pips))}${row("shots", avg(S.fl.shots))}${row("estimate", S.cal.length ? Math.round(S.cal.slice(-10).reduce((a, x) => a + x, 0) / Math.min(10, S.cal.length)) + " pt miss" : "")}</div>`;
  h += `<p class="gh">Fundamentals</p><div class="group">${row("opening", accOf("opening"))}${row("bearoff", accOf("bearoff"))}</div>`;
  h += `<p class="gh">The cube</p><div class="group">${row("cube1", accOf("cube1"))}${row("take", accOf("take"))}${row("racecube", accOf("racecube"))}${row("cube2", accOf("cube2"))}</div>`;
  h += `<p class="gh">Checker play by theme</p><div class="group">${CONC.filter(c => c.kind === "move").map(c => row(c.id, accOf(c.id))).join("")}</div>`;
  return h;
}
function viewReview() {
  const due = dueList(), deck = deckSize();
  let h = header("Review", "Positions you missed come back on a schedule: 1, 3, 7, 21 and 60 days.", false);
  if (!deck) h += `<div class="hero"><h2>Nothing to review yet</h2><p class="muted">When you miss a position, it lands here and returns the next day. Get it right and the gap grows until it's retired.</p><button class="btn primary block" data-go="today">Start today's session</button></div>`;
  else h += `<div class="hero"><h2>${due.length ? `${due.length} due today` : "All caught up"}</h2><p class="muted">${deck} position${deck === 1 ? "" : "s"} in your deck.${due.length ? "" : " The next ones come back tomorrow or later."}</p>${due.length ? `<button class="btn primary block" data-go="review">Review ${Math.min(15, due.length)} now</button>` : ""}</div>`;
  const miss = []; const seen = new Set();
  for (let i = S.hist.length - 1; i >= 0 && miss.length < 15; i--) { const x = S.hist[i]; if (x.s < 0.5 && !seen.has(x.id) && ITEMS[x.id]) { seen.add(x.id); miss.push(x); } }
  if (miss.length) {
    h += `<p class="gh">Recent misses<small>Tap one to try it again now.</small></p><div class="group">`;
    miss.forEach(x => {
      const st = S.items[x.id] || {};
      h += `<button class="row" data-go="redo:${x.id}"><span class="tx"><span class="tt">${esc(CBY[x.c] ? CBY[x.c].title : "Position")}</span><br><span class="ds">${x.y != null ? `You: ${esc(x.y)}. Best: ${esc(x.b)}.` : ""}</span></span><span class="val">${st.due ? (st.due <= today() ? "Due" : st.due.slice(5).replace("-", "/")) : "Retired"}</span><span class="chev">${NEXTICON}</span></button>`;
    });
    h += `</div>`;
  }
  return h;
}
function spark() {
  const L = S.rlog.slice(-30); if (L.length < 2) return "";
  const rs = L.map(x => x.r), lo = Math.min(...rs) - 10, hi = Math.max(...rs) + 10, W = 300, H = 56;
  const pts = rs.map((r, i) => `${(i / (rs.length - 1) * W).toFixed(1)},${(H - 4 - (r - lo) / (hi - lo) * (H - 8)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Rating trend"><polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function viewProgress() {
  const R = overall(), wk = S.rlog.find(x => x.d >= addDays(today(), -7)), d7 = wk ? R - wk.r : 0;
  const last = S.hist.slice(-50), acc = last.length ? Math.round(100 * last.reduce((a, x) => a + x.s, 0) / last.length) : null;
  let h = header("Progress", "", true);
  h += `<div class="hero"><p class="muted small" style="margin:0">Rating</p><div style="display:flex;align-items:baseline;gap:12px"><span class="num" style="font-size:52px;font-weight:650;letter-spacing:-.03em;font-variation-settings:'wdth' 82">${R}</span><span class="delta ${d7 >= 0 ? "up" : "down"}">${d7 ? (d7 > 0 ? "+" : "−") + Math.abs(d7) + " this week" : ""}</span></div><p class="muted" style="margin:0">${levelName(R)}</p>${spark()}</div>`;
  h += `<div class="stats"><div class="stat"><div class="v">${S.hist.length}</div><div class="l">positions solved</div></div><div class="stat"><div class="v">${acc != null ? acc + "%" : "–"}</div><div class="l">last 50 accuracy</div></div><div class="stat"><div class="v">${streak()}</div><div class="l">day streak</div></div></div>`;
  const focus = CONC.filter(c => (S.n[c.id] || 0) >= 3).sort((a, b) => mastery(a.id) - mastery(b.id)).slice(0, 3);
  if (focus.length) h += `<p class="gh">Focus areas<small>Your lowest mastery among topics you've practised.</small></p><div class="group">${focus.map(c => `<button class="row" data-go="drill:${c.id}">${ring(mastery(c.id))}<span class="tx"><span class="tt">${esc(c.title)}</span><br><span class="ds">Practise 10 positions</span></span><span class="chev">${NEXTICON}</span></button>`).join("")}</div>`;
  [[1, "Foundations"], [2, "Intermediate"], [3, "Advanced"]].forEach(([t, name]) => {
    h += `<p class="gh">${name}</p><div class="group">${CONC.filter(c => c.tier === t).map(c => `<button class="row" data-go="concept:${c.id}">${ring(mastery(c.id), 32, !S.n[c.id])}<span class="tx"><span class="tt">${esc(c.title)}</span></span><span class="val">${stateTxt(c)}</span></button>`).join("")}</div>`;
  });
  return h;
}

/* ---------- settings ---------- */
function openSettings() {
  const seg = (key, opts) => `<div class="seg" data-key="${key}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(S.cfg[key]) === String(v)}">${l}</button>`).join("")}</div>`;
  $("setBody").innerHTML = `
    <div class="row"><span class="tx"><span class="tt">Session length</span><br><span class="ds">Positions per daily session</span></span>${seg("len", [[6, "6"], [10, "10"], [16, "16"]])}</div>
    <div class="row"><span class="tx"><span class="tt">Level</span><br><span class="ds">Auto unlocks topics as you improve. Beginner restarts the foundation lessons.</span></span>${seg("level", [["auto", "Auto"], ["beg", "Beg"], ["int", "Int"], ["adv", "Adv"]])}</div>
    <div class="row"><span class="tx"><span class="tt">Challenge</span><br><span class="ds">How often you should get it right</span></span>${seg("target", [["comf", "Easier"], ["bal", "Balanced"], ["str", "Harder"]])}</div>
    <div class="row"><span class="tx"><span class="tt">Hints</span><br><span class="ds">Hint button on checker plays</span></span>${seg("hints", [[true, "On"], [false, "Off"]])}</div>
    <button class="row" id="sPlace"><span class="tx"><span class="tt">Retake placement</span></span><span class="chev">${NEXTICON}</span></button>
    <button class="row" id="sReset"><span class="tx"><span class="tt" style="color:var(--bad)">Reset all progress</span></span></button>`;
  $("setBody").querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = sg.dataset.key; let v = b.dataset.v; if (k === "len") v = +v; if (k === "hints") v = v === "true";
    S.cfg[k] = v;
    if (k === "level" && v === "beg") { CONC.forEach(c => { if (!S.seen[c.id]) delete S.intro[c.id]; }); S.sess = null; TODAYPLAN = null; }
    save(); sg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
  $("sPlace").onclick = () => { $("setDlg").close(); placementRun(); };
  $("sReset").onclick = () => { if (confirm("Erase your rating, history and review deck?")) { S = blank(); save(); $("setDlg").close(); TAB = "today"; renderView(); } };
  $("setDlg").showModal();
}
$("setDone").onclick = () => { $("setDlg").close(); renderView(); };

/* ================= boot ================= */
renderView();
window.__ac = { lk, findTerms, openSheet, doSteps, analyzeMove, START, S: () => S, BANK, ITEMS, startRun, planToday, lessonRun, drillRun, placementRun, nextEntry, get RUN() { return RUN; }, V, M, analyzeMove, CBY, poolFor, mastery, overall };

</script>
