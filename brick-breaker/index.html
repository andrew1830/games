<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  :root {
    color-scheme: light;
    --page: #b4c2d0;
    --field: #fbfcfd;
    --edge: #22303c;
    --ink: #22303c;
    --muted: #5d6b78;
    --paddle: #22303c;
    --ball: #22303c;
    --b1: #e4572e;
    --b2: #f3a712;
    --b3: #29a19c;
    --b4: #4c5fd5;
    --b5: #9b5de5;
    --power: #d6336c;
    --overlay: rgba(251, 252, 253, 0.9);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0b1016;
      --field: #253446;
      --edge: #5f7590;
      --ink: #e8eef3;
      --muted: #9aa8b5;
      --paddle: #e8eef3;
      --ball: #ffffff;
      --b1: #ff6b45;
      --b2: #ffbe3d;
      --b3: #3cc4be;
      --b4: #7486ff;
      --b5: #b98aff;
      --power: #ff5c93;
      --overlay: rgba(37, 52, 70, 0.9);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: var(--page);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  .hud {
    width: 100%;
    max-width: 640px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .saved { font-size: 0.85rem; font-weight: 400; color: var(--muted); min-width: 6ch; text-align: center; }
  .wrap { position: relative; width: 100%; max-width: 640px; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: var(--field);
    border: 3px solid var(--edge);
    border-radius: 6px;
    touch-action: none;
    cursor: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--overlay);
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 2.2rem; }
  .overlay p { margin: 0; color: var(--muted); max-width: 40ch; line-height: 1.5; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 10px 22px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--ink);
    color: var(--field);
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); }
  button:focus-visible { outline: 3px solid var(--b4); outline-offset: 3px; }
  .help { font-size: 0.85rem; color: var(--muted); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div style="width:100%;max-width:640px"><a href="../" style="font:700 14px system-ui,sans-serif;color:inherit;opacity:.7;text-decoration:none">&larr; All games</a></div>
  <div class="hud">
    <span id="level">Level 1</span>
    <span id="score">Score 0</span>
    <span class="saved" id="saved"></span>
    <span id="lives">Lives 3</span>
  </div>

  <div class="wrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">Brick Breaker</h1>
      <p id="message"></p>
      <div class="buttons" id="buttons"></div>
    </div>
  </div>

  <div class="help">
    Move: mouse / touch / ← → / A D / left and right Shift &nbsp;|&nbsp; Launch: space or click &nbsp;|&nbsp; Pause: P<br>
    Catch the pink capsule for multi-ball. Outlined bricks take two hits.
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const levelEl = document.getElementById('level');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const savedEl = document.getElementById('saved');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('message');
const buttonsEl = document.getElementById('buttons');

// ---- Colors from CSS (light/dark mode) ----
let colors = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  const v = n => s.getPropertyValue(n).trim();
  colors = {
    paddle: v('--paddle'), ball: v('--ball'), ink: v('--ink'), power: v('--power'),
    bricks: [v('--b1'), v('--b2'), v('--b3'), v('--b4'), v('--b5')]
  };
}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

// ---- Levels ----
// '.' = empty, a-e = normal brick (color 1-5), A-E = tough brick (two hits)
const LEVELS = [
  [ 'aaaaaaaaaa',
    'bbbbbbbbbb',
    'cccccccccc',
    'dddddddddd',
    'eeeeeeeeee' ],
  [ '....aa....',
    '...bbbb...',
    '..cccccc..',
    '.dddddddd.',
    'eeeeeeeeee' ],
  [ 'a.a.a.a.a.',
    '.b.b.b.b.b',
    'C.C.C.C.C.',
    '.d.d.d.d.d',
    'e.e.e.e.e.',
    '.A.A.A.A.A' ],
  [ 'AAAAAAAAAA',
    'a........a',
    'a.cccccc.a',
    'a.cDDDDc.a',
    'a.cccccc.a',
    'b........b',
    'bbbb..bbbb' ],
  [ '....AA....',
    '...BbbB...',
    '..CccccC..',
    '.DddddddD.',
    'EeeeeeeeeE',
    '.DddddddD.',
    '..CccccC..',
    '...BbbB...',
    '....AA....' ]
];

// ---- Settings ----
const PADDLE_W = 100, PADDLE_H = 12, PADDLE_Y = H - 36, PADDLE_SPEED = 520;
const BALL_R = 7, BASE_SPEED = 320, SPEED_PER_LEVEL = 30;
const COLS = 10, BRICK_H = 20, BRICK_GAP = 6, TOP = 50, SIDE = 20;
const BRICK_W = (W - SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;
const DROP_CHANCE = 0.12, DROP_SPEED = 150, DROP_W = 34, DROP_H = 16, MAX_BALLS = 12;

// ---- State ----
let paddleX = (W - PADDLE_W) / 2;
let balls = [], bricks = [], drops = [];
let level = 1, score = 0, lives = 3;
let state = 'menu'; // menu | ready | playing | paused | between | over | won
let stateBeforePause = 'ready';
const keys = { left: false, right: false };
let mouseTargetX = null;

const ballSpeed = () => BASE_SPEED + SPEED_PER_LEVEL * (level - 1);

// ---- Saving ----
// Uses Claude's artifact storage when available, otherwise the browser's
// localStorage (when you open the file directly). Fails quietly if neither works.
const SAVE_KEY = 'brick-breaker-save';
const store = {
  async get() {
    try {
      if (window.storage) {
        const r = await window.storage.get(SAVE_KEY, false);
        return r ? JSON.parse(r.value) : null;
      }
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  },
  async set(data) {
    try {
      const s = JSON.stringify(data);
      if (window.storage) return !!(await window.storage.set(SAVE_KEY, s, false));
      localStorage.setItem(SAVE_KEY, s);
      return true;
    } catch { return false; }
  },
  async clear() {
    try {
      if (window.storage) await window.storage.delete(SAVE_KEY, false);
      else localStorage.removeItem(SAVE_KEY);
    } catch {}
  }
};

let savedTimer;
function saveGame() {
  store.set({ v: 1, level, score, lives, hits: bricks.map(b => b.hits) }).then(ok => {
    savedEl.textContent = ok ? 'Saved' : 'Save failed';
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => { savedEl.textContent = ''; }, 1500);
  });
}

// ---- Setup ----
function loadLevel(n, hits) {
  level = n;
  bricks = [];
  LEVELS[n - 1].forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      const tough = ch === ch.toUpperCase();
      bricks.push({
        x: SIDE + c * (BRICK_W + BRICK_GAP),
        y: TOP + r * (BRICK_H + BRICK_GAP),
        color: ch.toLowerCase().charCodeAt(0) - 97,
        hits: tough ? 2 : 1
      });
    });
  });
  if (hits && hits.length === bricks.length) bricks.forEach((b, i) => { b.hits = hits[i]; });
  drops = [];
  resetBall();
  updateHud();
}

function resetBall() {
  balls = [{ x: paddleX + PADDLE_W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0 }];
}

function newGame() {
  score = 0; lives = 3;
  paddleX = (W - PADDLE_W) / 2;
  loadLevel(1);
  hideOverlay();
  state = 'ready';
  saveGame();
}

function continueGame(save) {
  score = save.score; lives = save.lives;
  paddleX = (W - PADDLE_W) / 2;
  loadLevel(save.level, save.hits);
  hideOverlay();
  state = 'ready';
}

function launch() {
  if (state !== 'ready') return;
  const angle = (Math.random() * 0.5 - 0.25) * Math.PI;
  balls[0].vx = ballSpeed() * Math.sin(angle);
  balls[0].vy = -ballSpeed() * Math.cos(angle);
  state = 'playing';
}

function updateHud() {
  levelEl.textContent = 'Level ' + level;
  scoreEl.textContent = 'Score ' + score;
  livesEl.textContent = 'Lives ' + lives;
}

// ---- Overlay / menus ----
function showOverlay(title, message, buttons) {
  titleEl.textContent = title;
  msgEl.textContent = message;
  buttonsEl.innerHTML = '';
  buttons.forEach(([label, fn], i) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (i > 0) b.className = 'secondary';
    b.addEventListener('click', fn);
    buttonsEl.appendChild(b);
  });
  overlay.hidden = false;
  if (buttonsEl.firstChild) buttonsEl.firstChild.focus();
}
function hideOverlay() {
  overlay.hidden = true;
  if (document.activeElement) document.activeElement.blur();
}

async function showMenu() {
  state = 'menu';
  const save = await store.get();
  const buttons = [];
  if (save && save.v === 1 && LEVELS[save.level - 1]) {
    buttons.push([`Continue level ${save.level}`, () => continueGame(save)]);
  }
  buttons.push(['New game', newGame]);
  showOverlay('Brick Breaker',
    `${LEVELS.length} levels. Mouse, touch, or keyboard moves the paddle. Space or click launches the ball.`,
    buttons);
}

function togglePause() {
  if (state === 'playing' || state === 'ready') {
    stateBeforePause = state;
    state = 'paused';
    saveGame();
    showOverlay('Paused', 'Your progress is saved.', [['Resume', resume], ['Quit to menu', showMenu]]);
  } else if (state === 'paused') {
    resume();
  }
}
function resume() {
  hideOverlay();
  state = stateBeforePause;
}

// ---- Input ----
function pointerToCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left - canvas.clientLeft) * (W / canvas.clientWidth);
}
canvas.addEventListener('mousemove', e => { mouseTargetX = pointerToCanvasX(e.clientX); });
canvas.addEventListener('mousedown', () => launch());
canvas.addEventListener('touchstart', e => {
  mouseTargetX = pointerToCanvasX(e.touches[0].clientX);
  launch();
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  mouseTargetX = pointerToCanvasX(e.touches[0].clientX);
  e.preventDefault();
}, { passive: false });

// e.code tells left Shift from right Shift; e.key can't
const LEFT_CODES = ['ArrowLeft', 'KeyA', 'ShiftLeft'];
const RIGHT_CODES = ['ArrowRight', 'KeyD', 'ShiftRight'];
document.addEventListener('keydown', e => {
  if (LEFT_CODES.includes(e.code)) { keys.left = true; mouseTargetX = null; e.preventDefault(); }
  else if (RIGHT_CODES.includes(e.code)) { keys.right = true; mouseTargetX = null; e.preventDefault(); }
  else if (e.code === 'Space' && state === 'ready') { launch(); e.preventDefault(); }
  else if (e.code === 'KeyP') togglePause();
});
document.addEventListener('keyup', e => {
  if (LEFT_CODES.includes(e.code)) keys.left = false;
  if (RIGHT_CODES.includes(e.code)) keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });
// Auto-pause (and save) when you switch tabs or apps
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'playing' || state === 'ready')) togglePause();
});

// ---- Update ----
function update(dt) {
  if (mouseTargetX !== null) {
    paddleX = mouseTargetX - PADDLE_W / 2;
  } else {
    if (keys.left) paddleX -= PADDLE_SPEED * dt;
    if (keys.right) paddleX += PADDLE_SPEED * dt;
  }
  paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

  if (state === 'ready') {
    balls[0].x = paddleX + PADDLE_W / 2;
    balls[0].y = PADDLE_Y - BALL_R - 1;
    return;
  }
  if (state !== 'playing') return;

  // Balls, moved in small steps so they can't tunnel through bricks
  for (const ball of balls) {
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (BALL_R / 2));
    for (let i = 0; i < steps && !ball.lost; i++) stepBall(ball, dt / steps);
  }
  balls = balls.filter(b => !b.lost);

  // Power-up capsules
  for (const d of drops) {
    d.y += DROP_SPEED * dt;
    if (d.y + DROP_H / 2 >= PADDLE_Y && d.y - DROP_H / 2 <= PADDLE_Y + PADDLE_H &&
        d.x + DROP_W / 2 >= paddleX && d.x - DROP_W / 2 <= paddleX + PADDLE_W) {
      d.done = true;
      splitBalls();
    } else if (d.y - DROP_H > H) {
      d.done = true;
    }
  }
  drops = drops.filter(d => !d.done);

  if (bricks.every(b => b.hits <= 0)) { levelCleared(); return; }
  if (balls.length === 0) loseLife();
}

function stepBall(ball, dt) {
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

  // Paddle: bounce angle depends on where the ball hits
  if (ball.vy > 0 &&
      ball.y + BALL_R >= PADDLE_Y && ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 8 &&
      ball.x >= paddleX - BALL_R && ball.x <= paddleX + PADDLE_W + BALL_R) {
    const hit = (ball.x - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
    const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
    const speed = Math.hypot(ball.vx, ball.vy);
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    ball.y = PADDLE_Y - BALL_R;
  }

  for (const b of bricks) {
    if (b.hits <= 0) continue;
    const nx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
    const ny = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
    const dx = ball.x - nx, dy = ball.y - ny;
    if (dx * dx + dy * dy <= BALL_R * BALL_R) {
      b.hits--;
      score += 10 * level;
      updateHud();
      if (b.hits === 0 && balls.length < MAX_BALLS && Math.random() < DROP_CHANCE) {
        drops.push({ x: b.x + BRICK_W / 2, y: b.y + BRICK_H / 2 });
      }
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + BRICK_W - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + BRICK_H - (ball.y - BALL_R));
      if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
      break;
    }
  }

  if (ball.y - BALL_R > H) ball.lost = true;
}

// Every ball in play spawns two more, angled off its current path
function splitBalls() {
  const added = [];
  for (const b of balls) {
    for (const a of [-0.45, 0.45]) {
      if (balls.length + added.length >= MAX_BALLS) break;
      const c = Math.cos(a), s = Math.sin(a);
      const nb = { x: b.x, y: b.y, vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c };
      // Keep new balls from moving too flat, which makes them crawl side to side
      const speed = Math.hypot(nb.vx, nb.vy);
      if (Math.abs(nb.vy) < speed * 0.35) {
        nb.vy = Math.sign(nb.vy || -1) * speed * 0.35;
        nb.vx = Math.sign(nb.vx) * Math.sqrt(speed * speed - nb.vy * nb.vy);
      }
      added.push(nb);
    }
  }
  balls.push(...added);
}

function loseLife() {
  lives--;
  drops = [];
  updateHud();
  if (lives <= 0) {
    state = 'over';
    store.clear();
    showOverlay('Game over', `You reached level ${level} with ${score} points.`, [['Play again', newGame]]);
  } else {
    resetBall();
    state = 'ready';
    saveGame();
  }
}

function levelCleared() {
  if (level === LEVELS.length) {
    state = 'won';
    store.clear();
    showOverlay('You beat every level', `Final score ${score}.`, [['Play again', newGame]]);
    return;
  }
  const cleared = level;
  loadLevel(level + 1);
  saveGame();
  state = 'between';
  showOverlay(`Level ${cleared} cleared`, `Score ${score}. The ball gets a little faster.`,
    [[`Start level ${level}`, () => { hideOverlay(); state = 'ready'; }]]);
}

// ---- Draw ----
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const b of bricks) {
    if (b.hits <= 0) continue;
    ctx.fillStyle = colors.bricks[b.color % colors.bricks.length];
    rr(b.x, b.y, BRICK_W, BRICK_H, 3);
    ctx.fill();
    if (b.hits > 1) {
      ctx.strokeStyle = colors.ink;
      ctx.lineWidth = 2.5;
      rr(b.x + 1.5, b.y + 1.5, BRICK_W - 3, BRICK_H - 3, 2);
      ctx.stroke();
    }
  }

  // Multi-ball capsule: a pill with three dots
  for (const d of drops) {
    ctx.fillStyle = colors.power;
    rr(d.x - DROP_W / 2, d.y - DROP_H / 2, DROP_W, DROP_H, DROP_H / 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (const off of [-8, 0, 8]) {
      ctx.beginPath();
      ctx.arc(d.x + off, d.y, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.fillStyle = colors.paddle;
  rr(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
  ctx.fill();

  ctx.fillStyle = colors.ball;
  for (const ball of balls) {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  }

  if (state === 'ready') {
    ctx.fillStyle = colors.ink;
    ctx.globalAlpha = 0.6;
    ctx.font = '600 16px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Space or click to launch', W / 2, PADDLE_Y - 60);
    ctx.globalAlpha = 1;
  }
}

// ---- Loop ----
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state === 'ready' || state === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}

loadLevel(1); // shows level 1 behind the menu
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
